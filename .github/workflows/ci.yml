name: AURA CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-verify:
    name: Build, Lint, Security & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Installation
        run: npm ci

      - name: Static Analysis & Linting (ESLint 9)
        run: npm run lint

      - name: Code Formatting Check (Prettier)
        run: npm run format

      - name: Execute Automated Vitest Suite (Unit, Integration & E2E Workflows)
        run: npm test

      - name: Production Build Compilation (Vite)
        run: npm run build

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev
