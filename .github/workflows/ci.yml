name: AURA CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-verify:
    name: Build, Lint, Security & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Installation
        run: npm ci --ignore-scripts

      - name: Static Analysis & Linting (ESLint 9)
        run: npm run lint

      - name: TypeScript Syntax & Type Integrity Check
        run: npm run typecheck

      - name: Code Formatting Check (Prettier)
        run: npm run format

      - name: Execute Vitest Suite with Coverage (V8 Provider)
        run: npm run test:coverage

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev

      - name: Production Build Compilation (Vite)
        run: npm run build

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Execute End-to-End Test Suite (Playwright)
        run: npm run test:e2e
